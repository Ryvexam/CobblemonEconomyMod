name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ forgejo.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ forgejo.ref_name }}
    runs-on: docker
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Java 21
        uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install release tooling
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends curl jq

      - name: Validate release configuration
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          : "${FORGEJO_REF_NAME:?Forgejo did not provide a tag reference}"
          TAG="$FORGEJO_REF_NAME"
          VERSION="${TAG#v}"
          if [[ "$TAG" != v* || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use v<semantic-version>, got: $TAG" >&2
            exit 1
          fi

          command -v curl >/dev/null || { echo 'curl is required on the Forgejo runner' >&2; exit 1; }
          command -v jq >/dev/null || { echo 'jq is required on the Forgejo runner' >&2; exit 1; }
          CONFIG_FILE=.forgejo/release-config.json
          if [[ ! -f "$CONFIG_FILE" ]] || ! jq -e . "$CONFIG_FILE" >/dev/null; then
            echo "Invalid or missing release configuration: $CONFIG_FILE" >&2
            exit 1
          fi

          MINECRAFT_VERSION=$(jq -er '.minecraft_version | select(type == "string" and length > 0)' "$CONFIG_FILE")
          LOADER=$(jq -er '.loader | select(type == "string" and length > 0)' "$CONFIG_FILE")
          MODRINTH_PROJECT_ID=$(jq -er '.modrinth_project_id | select(type == "string" and length > 0)' "$CONFIG_FILE")
          CURSEFORGE_PROJECT_ID=$(jq -er '.curseforge_project_id | if type == "number" then tostring elif type == "string" and length > 0 then . else error("invalid project ID") end' "$CONFIG_FILE")
          CURSEFORGE_GAME_ID=$(jq -er '.curseforge_game_id | if type == "number" then tostring elif type == "string" and length > 0 then . else error("invalid game ID") end' "$CONFIG_FILE")
          CURSEFORGE_GAME_VERSION_IDS=$(jq -er '
            .curseforge_game_version_ids
            | if type == "array" and length > 0 and all(.[]; type == "number" and floor == .)
              then map(tostring) | join(",")
              else error("invalid game version IDs")
              end
          ' "$CONFIG_FILE")

          if [[ "$LOADER" != fabric ]]; then
            echo "This workflow currently supports only the Fabric loader, got: $LOADER" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$FORGEJO_OUTPUT"
          echo "tag=$TAG" >> "$FORGEJO_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$FORGEJO_OUTPUT"
          echo "loader=$LOADER" >> "$FORGEJO_OUTPUT"
          echo "modrinth_project_id=$MODRINTH_PROJECT_ID" >> "$FORGEJO_OUTPUT"
          echo "curseforge_project_id=$CURSEFORGE_PROJECT_ID" >> "$FORGEJO_OUTPUT"
          echo "curseforge_game_id=$CURSEFORGE_GAME_ID" >> "$FORGEJO_OUTPUT"
          echo "curseforge_game_version_ids=$CURSEFORGE_GAME_VERSION_IDS" >> "$FORGEJO_OUTPUT"

      - name: Build and test the release JAR
        id: build
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test build --no-daemon --console=plain "-Pmod_version=$RELEASE_VERSION"

          ARTIFACT="build/libs/cobblemon-economy-${RELEASE_VERSION}.jar"
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "Expected release artifact was not produced: $ARTIFACT" >&2
            find build/libs -maxdepth 1 -type f -name '*.jar' -print >&2
            exit 1
          fi
          PUBLISH_CANDIDATES="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print)"
          PUBLISH_COUNT="$(printf '%s\n' "$PUBLISH_CANDIDATES" | awk 'NF { count++ } END { print count + 0 }')"
          if [[ "$PUBLISH_COUNT" -ne 1 || "$PUBLISH_CANDIDATES" != "$ARTIFACT" ]]; then
            echo 'Expected exactly one non-sources JAR for publication' >&2
            printf '%s\n' "$PUBLISH_CANDIDATES" >&2
            exit 1
          fi
          echo "artifact=$ARTIFACT" >> "$FORGEJO_OUTPUT"

      - name: Upload the tagged JAR
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: cobblemon-economy-${{ steps.metadata.outputs.version }}
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error

      - name: Validate publication credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in MODRINTH_TOKEN CURSEFORGE_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing Forgejo secret: $variable" >&2
              exit 1
            fi
          done

      - name: Validate CurseForge game versions
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_GAME_ID: ${{ steps.metadata.outputs.curseforge_game_id }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ steps.metadata.outputs.curseforge_game_version_ids }}
          RELEASE_MINECRAFT_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          RELEASE_LOADER: ${{ steps.metadata.outputs.loader }}
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS_FILE=$(mktemp)
          trap 'rm -f "$VERSIONS_FILE"' EXIT
          curl --fail --silent --show-error \
            -H 'Accept: application/json' \
            -H "x-api-key: $CURSEFORGE_TOKEN" \
            "https://api.curseforge.com/v2/games/${CURSEFORGE_GAME_ID}/versions" > "$VERSIONS_FILE"

          GAME_VERSION_IDS=$(printf '%s' "$CURSEFORGE_GAME_VERSION_IDS" | tr ',' '\n' | jq -R -s 'split("\n") | map(select(length > 0)) | map(tonumber)')
          while IFS= read -r version_id; do
            if ! jq -e --argjson version_id "$version_id" \
                '[.data[].versions[] | .id] | index($version_id) != null' "$VERSIONS_FILE" >/dev/null; then
              echo "CurseForge game version ID is not available for game ${CURSEFORGE_GAME_ID}: ${version_id}" >&2
              exit 1
            fi
          done < <(printf '%s' "$CURSEFORGE_GAME_VERSION_IDS" | tr ',' '\n')

          if ! jq -e \
              --arg minecraft_version "$RELEASE_MINECRAFT_VERSION" \
              --argjson version_ids "$GAME_VERSION_IDS" \
              'any(.data[].versions[]; .name == $minecraft_version and (.id as $id | $version_ids | index($id) != null))' \
              "$VERSIONS_FILE" >/dev/null; then
            echo "CurseForge version IDs do not include Minecraft ${RELEASE_MINECRAFT_VERSION}" >&2
            exit 1
          fi
          if ! jq -e \
              --arg loader "$RELEASE_LOADER" \
              --argjson version_ids "$GAME_VERSION_IDS" \
              'any(.data[].versions[]; (.name | ascii_downcase) == ($loader | ascii_downcase) and (.id as $id | $version_ids | index($id) != null))' \
              "$VERSIONS_FILE" >/dev/null; then
            echo "CurseForge version IDs do not include loader ${RELEASE_LOADER}" >&2
            exit 1
          fi

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          awk -v section="## [$RELEASE_VERSION]" '
            index($0, section) == 1 { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            awk '
              /^## \[Unreleased\]/ { in_section=1; next }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'Release %s\n' "$RELEASE_TAG" > release-notes.md
          fi

      - name: Check existing Modrinth version
        id: modrinth_version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          MODRINTH_PROJECT_ID: ${{ steps.metadata.outputs.modrinth_project_id }}
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS_FILE=$(mktemp)
          trap 'rm -f "$VERSIONS_FILE"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version" > "$VERSIONS_FILE"

          if jq -e --arg version "$RELEASE_VERSION" \
              'any(.[]; .version_number == $version)' "$VERSIONS_FILE" >/dev/null; then
            echo "publish=false" >> "$FORGEJO_OUTPUT"
            echo "Modrinth $RELEASE_VERSION already exists; skipping upload."
          else
            echo "publish=true" >> "$FORGEJO_OUTPUT"
          fi

      - name: Publish to Modrinth
        if: steps.modrinth_version.outputs.publish == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_ARTIFACT: ${{ steps.build.outputs.artifact }}
          RELEASE_MINECRAFT_VERSION: ${{ steps.metadata.outputs.minecraft_version }}
          RELEASE_LOADER: ${{ steps.metadata.outputs.loader }}
          MODRINTH_PROJECT_ID: ${{ steps.metadata.outputs.modrinth_project_id }}
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(jq -n \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg version "$RELEASE_VERSION" \
            --arg minecraft_version "$RELEASE_MINECRAFT_VERSION" \
            --arg loader "$RELEASE_LOADER" \
            --arg body "$(cat release-notes.md)" \
            '{project_id: $project, version_number: $version,
              version_title: ("Cobblemon Economy " + $version),
              version_body: $body, loaders: [$loader],
              game_versions: [$minecraft_version], version_type: "release",
              featured: false, dependencies: [], file_parts: ["file"],
              primary_file: "file"}')

          DATA_FILE=$(mktemp)
          HEADER_FILE=$(mktemp)
          trap 'rm -f "$HEADER_FILE" "$DATA_FILE"' EXIT
          printf '%s' "$DATA" > "$DATA_FILE"
          printf 'Authorization: %s\n' "$MODRINTH_TOKEN" > "$HEADER_FILE"
          curl --fail --silent --show-error \
            -X POST 'https://api.modrinth.com/v2/version' \
            -H "@$HEADER_FILE" \
            -A "CobblemonEconomyMod/$RELEASE_VERSION (https://github.com/Ryvexam/CobblemonEconomyMod)" \
            -F "data=<$DATA_FILE;type=application/json" \
            -F "file=@$RELEASE_ARTIFACT"

      - name: Check existing CurseForge file
        id: curseforge_version
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          CURSEFORGE_PROJECT_ID: ${{ steps.metadata.outputs.curseforge_project_id }}
        shell: bash
        run: |
          set -euo pipefail
          INDEX=0
          PAGE_SIZE=50
          FOUND=false
          while :; do
            FILES_FILE=$(mktemp)
            trap 'rm -f "$FILES_FILE"' EXIT
            curl --fail --silent --show-error \
              -G "https://api.curseforge.com/v1/mods/${CURSEFORGE_PROJECT_ID}/files" \
              -H 'Accept: application/json' \
              -H "x-api-key: $CURSEFORGE_TOKEN" \
              --data-urlencode "index=$INDEX" \
              --data-urlencode "pageSize=$PAGE_SIZE" > "$FILES_FILE"

            if jq -e \
                --arg display_name "Cobblemon Economy $RELEASE_VERSION" \
                --arg file_name "cobblemon-economy-$RELEASE_VERSION.jar" \
                'any(.data[]; .displayName == $display_name or .fileName == $file_name)' \
                "$FILES_FILE" >/dev/null; then
              FOUND=true
              break
            fi

            RESULT_COUNT=$(jq -er '.pagination.resultCount // (.data | length)' "$FILES_FILE")
            TOTAL_COUNT=$(jq -er '.pagination.totalCount // 0' "$FILES_FILE")
            rm -f "$FILES_FILE"
            if (( RESULT_COUNT == 0 || RESULT_COUNT < PAGE_SIZE || (TOTAL_COUNT > 0 && INDEX + RESULT_COUNT >= TOTAL_COUNT) )); then
              break
            fi
            INDEX=$((INDEX + RESULT_COUNT))
          done

          if [[ "$FOUND" == true ]]; then
            echo "publish=false" >> "$FORGEJO_OUTPUT"
            echo "CurseForge $RELEASE_VERSION already exists; skipping upload."
          else
            echo "publish=true" >> "$FORGEJO_OUTPUT"
          fi

      - name: Publish to CurseForge
        if: steps.curseforge_version.outputs.publish == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_ARTIFACT: ${{ steps.build.outputs.artifact }}
          CURSEFORGE_PROJECT_ID: ${{ steps.metadata.outputs.curseforge_project_id }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ steps.metadata.outputs.curseforge_game_version_ids }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_VERSIONS=$(printf '%s' "$CURSEFORGE_GAME_VERSION_IDS" | tr ',' '\n' | jq -R -s 'split("\n") | map(select(length > 0)) | map(tonumber)')
          METADATA=$(jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg body "$(cat release-notes.md)" \
            --argjson game_versions "$GAME_VERSIONS" \
            '{changelog: $body, changelogType: "markdown",
              displayName: ("Cobblemon Economy " + $version),
              gameVersions: $game_versions, releaseType: "release",
              isMarkedForManualRelease: false}')

          HEADER_FILE=$(mktemp)
          trap 'rm -f "$HEADER_FILE"' EXIT
          printf 'X-Api-Token: %s\n' "$CURSEFORGE_TOKEN" > "$HEADER_FILE"
          curl --fail-with-body --silent --show-error \
            -X POST "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file" \
            -H "@$HEADER_FILE" \
            --form-string "metadata=$METADATA" \
            -F "file=@$RELEASE_ARTIFACT;type=application/java-archive"
