name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build JAR
    runs-on: docker
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up Java 21
        uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        id: build
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean test build --no-daemon --console=plain

          VERSION="$(awk -F= '$1 == "mod_version" { gsub(/[[:space:]]/, "", $2); print $2; exit }' gradle.properties)"
          if [[ -z "$VERSION" ]]; then
            echo 'Could not determine mod_version from gradle.properties' >&2
            exit 1
          fi

          ARTIFACT="build/libs/cobblemon-economy-${VERSION}.jar"
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "Expected JAR was not produced: $ARTIFACT" >&2
            find build/libs -maxdepth 1 -type f -name '*.jar' -print >&2
            exit 1
          fi

          CANDIDATES="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print)"
          COUNT="$(printf '%s\n' "$CANDIDATES" | awk 'NF { count++ } END { print count + 0 }')"
          if [[ "$COUNT" -ne 1 || "$CANDIDATES" != "$ARTIFACT" ]]; then
            echo 'Expected exactly one non-sources JAR' >&2
            printf '%s\n' "$CANDIDATES" >&2
            exit 1
          fi

          echo "artifact=$ARTIFACT" >> "$FORGEJO_OUTPUT"

      - name: Upload build JAR
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: cobblemon-economy-ci-${{ forgejo.sha }}
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
